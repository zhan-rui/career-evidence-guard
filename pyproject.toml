[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-evidence-guard"
version = "0.1.1"
description = "Local-first job-posting change detection and evidence alignment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Zhan Rui"}]
dependencies = []

[project.scripts]
career-guard = "career_guard.cli:main"

[tool.setuptools]
packages = ["career_guard"]
